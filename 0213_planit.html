<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      ul.con {
        width: 1903px;
        height: 800px;
        margin: 50px auto;
        display: flex;
      }
      ul.con li {
        flex: 1;
        text-align: center;
      }
      ul.con li div {
        height: 100%;
        padding: 12px;
        color: #fff;
      }
      ul.con li div h1 {
        font-size: 100px;
      }
      ul.con li div p {
        font-size: 16px;
      }
      ul.con li div.one {
        background: url(https://www.planit147.com/assets/images/main/sect02_bg01.jpg);
      }
      ul.con li div.two {
        background: url(https://www.planit147.com/assets/images/main/sect02_bg02.jpg);
      }
      ul.con li div.three {
        background: url(https://www.planit147.com/assets/images/main/sect02_bg03.jpg);
      }
    </style>
  </head>
  <body>
    <ul class="con">
      <li>
        <div class="one">
          <h1>Easy</h1>
          <p>쉽고</p>
          <p>
            고객의 쉽고 빠른 뷰티 비즈니스를 위하여 <br />
            브랜딩부터 기획, 생산까지 <br />
            전 영역에 걸쳐 서비스를 제공합니다.
          </p>
        </div>
      </li>
      <li>
        <div class="two">
          <h1>Proven</h1>
          <p>검증된</p>
          <p>
            브랜드 기획자와 연구원 출신의 전문가가 기획하고 <br />
            실제 시장에 테스트하며 기획력을 검증합니다.
          </p>
        </div>
      </li>
      <li>
        <div class="three">
          <h1>Reliable</h1>
          <p>믿을 수 있는</p>
          <p>
            머신러닝을 기반으로 개발한 <br />
            상품 모형 평가 및 예측 알고리즘을 토대로 <br />
            고객에게 제안합니다.
          </p>
        </div>
      </li>
    </ul>
  </body>
</html>
