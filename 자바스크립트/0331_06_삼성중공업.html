<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {

      }
      .sam {
        border: 1px solid;
        width: 100%;
        height: 676px;
        margin: 0 auto;
        background: url(https://www.samsungshi.com/images/sub/sVisual_01.jpg)
          center/cover;
      }
      .txt {
        height: 100%;
        font-size: 60px;
        line-height: 1;
        font-weight: bold;
        border: 1px solid;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
      }

      .sung {
        border: 1px solid;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }
      .sung li {
        width: 180px;
      }
      .sung li a {
        font-size: 22px;
      }
    </style>
