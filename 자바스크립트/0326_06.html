<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      #business {
        width: 1905px;
        height: 450px;
        margin: 0 auto;
        display: flex;
        text-align: center;
        border: 1px solid;
      }
      #business ul {
        width: 1400px;
        height: 180px;
        margin: 150px auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 64px;
        border: 1px solid;
      }
      #business ul li {
        width: 180px;
      }
      #business ul li a {
        display: block;
        height: 180px;
        padding-top: 110px;
        border: 1px solid;
        border-radius: 50%;
        box-sizing: border-box;
        background: #fff no-repeat center 0 / auto 112px;
      }
      #business ul li:nth-child(1) a {
        background-image: url(https://www.shinsegaefood.com/images/business/bg_business_tab01.png);
      }
      #business ul li:nth-child(2) a {
        background-image: url(https://www.shinsegaefood.com/images/business/bg_business_tab02.png);
      }
      #business ul li:nth-child(3) a {
        background-image: url(https://www.shinsegaefood.com/images/business/bg_business_tab03.png);
      }
      #business ul li:nth-child(4) a {
        background-image: url(https://www.shinsegaefood.com/images/business/bg_business_tab04.png);
      }
      #business ul li:nth-child(5) a {
        background-image: url(https://www.shinsegaefood.com/images/business/bg_business_tab05.png);
      }
      #business ul li:nth-child(6) a {
        background-image: url(https://www.shinsegaefood.com/images/business/bg_business_tab06.png);
      }
    </style>
  </head>
  <body>
    <div id="business">
      <ul>
        <li>
          <a href="#">
            <span>식품제조/<br />유통</span>
          </a>
        </li>
        <li>
          <a href="#"> <span>푸드서비스</span></a>
        </li>
        <li>
          <a href="#">
            <span>프리미엄<br />다이닝</span></a
          >
        </li>
        <li>
          <a href="#"> <span>베이커리</span></a>
        </li>
        <li>
          <a href="#"> <span>프랜차이즈</span></a>
        </li>
        <li>
          <a href="#"> <span>자회사</span></a>
        </li>
      </ul>
    </div>
  </body>
</html>
