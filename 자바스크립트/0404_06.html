<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 기본 마우스 커서 숨기기 */
      body {
        cursor: none; /* 기본 커서를 숨깁니다 */
      }

      /* 동그란 커서 스타일 */
      .cursor {
        position: absolute;
        width: 80px; /* 커서 크기 */
        height: 80px;
        border-radius: 50%; /* 원형으로 만들기 */
        background-color: rgba(0, 0, 0, 0.5); /* 반투명한 검정색 */
        pointer-events: none; /* 커서가 클릭 가능한 요소 위에 있어도 영향을 주지 않도록 */
        transform: translate(
          -50%,
          -50%
        ); /* 커서가 정확하게 마우스를 따라가도록 위치 조정 */
        transition: all 0.1s ease;
        display: flex; /* 텍스트를 가운데 정렬하려면 flex 사용 */
        justify-content: center; /* 수평 중앙 정렬 */
        align-items: center; /* 수직 중앙 정렬 */
        color: white; /* 텍스트 색상 */
        font-size: 12px; /* 텍스트 크기 */
        font-weight: bold;
      }

      /* 이미지가 hover될 때 동그란 커서 스타일 변경 */
      ul li:hover .cursor {
        background-color: rgba(0, 0, 0, 0.8); /* 호버 시 커서 색상 변경 */
        transform: translate(-50%, -50%) scale(1.5); /* 호버 시 커서 크기 확대 */
        font-size: 16px; /* 커서 확대 시 텍스트 크기 증가 */
      }

      ul {
        list-style: none;
        width: 1190px;
        margin: 500px auto;
      }

      ul li {
        width: 374px;
        float: left;
        cursor: pointer; /* 커서가 손 모양으로 변경됩니다 */
        margin-right: calc((100% - (374px * 3)) / 2);
        transition: 0.5s;
      }

      ul li:nth-child(2) {
        margin-top: -100px;
      }

      ul li:last-child {
        margin-right: 0;
      }

      ul li img {
        width: 100%;
        object-fit: cover;
      }

      ul li:hover {
        margin-top: -50px;
      }

      ul li:nth-child(2):hover {
        margin-top: -150px;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <div class="txt">
          <p>자코모 소개</p>
          <p>About</p>
        </div>
        <p>
          <img
            src="https://www.jakomosofa.com/inc/img/main/info_sect_1.jpg"
            alt="img"
          />
        </p>
      </li>
      <li>
        <div class="txt">
          <p>자코모 이야기</p>
          <p>Story</p>
        </div>
        <p>
          <img
            src="https://www.jakomosofa.com/inc/img/main/info_sect_2.jpg"
            alt="img"
          />
        </p>
      </li>
      <li>
        <div class="txt">
          <p>자코모 제품 철학</p>
          <p>Philosophy</p>
        </div>
        <p>
          <img
            src="https://www.jakomosofa.com/inc/img/main/info_sect_3.jpg"
            alt="img"
          />
        </p>
      </li>
    </ul>

    <!-- 동그란 커서를 위한 요소 추가 -->
    <div class="cursor">View More</div>

    <script>
      const cursor = document.querySelector(".cursor"); // 동그란 커서
      const items = document.querySelectorAll("ul li"); // 이미지 목록

      // 마우스 위치 추적
      document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.pageX + "px"; // 마우스 X 위치
        cursor.style.top = e.pageY + "px"; // 마우스 Y 위치
      });

      // 이미지 hover 상태 확인
      items.forEach((item) => {
        item.addEventListener("mouseenter", () => {
          cursor.style.transform = "translate(-50%, -50%) scale(1.5)"; // 호버 시 커서 확대
        });
        item.addEventListener("mouseleave", () => {
          cursor.style.transform = "translate(-50%, -50%) scale(1)"; // 호버를 벗어나면 원래 크기로 돌아가기
        });
      });
    </script>
  </body>
</html>
