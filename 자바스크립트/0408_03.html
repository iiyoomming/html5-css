<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: #eee;
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #000;
        margin: 0;
        padding: 0;
      }

      .swiper {
        width: 1200px;
        margin: 0 auto;
        height: 600px;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #ccc;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .swiper {
        margin-left: auto;
        margin-right: auto;
      }
    </style>
  </head>

  <body>
    <!-- Swiper -->
    <div
      class="swiper mySwiper swiper-initialized swiper-horizontal swiper-backface-hidden"
    >
      <div
        class="swiper-wrapper"
        id="swiper-wrapper-1c52b1972d3c1015b"
        aria-live="off"
        style="
          transition-duration: 0ms;
          transform: translate3d(-2400px, 0px, 0px);
          transition-delay: 0ms;
        "
      >
        <div
          class="swiper-slide"
          role="group"
          aria-label="1 / 4"
          data-swiper-slide-index="0"
          style="width: 1200px"
        >
          <img src="../Html5&amp;CSS/images/photo1.jpg" alt="" />
        </div>
        <div
          class="swiper-slide swiper-slide-prev"
          role="group"
          aria-label="2 / 4"
          data-swiper-slide-index="1"
          style="width: 1200px"
        >
          <img src="../Html5&amp;CSS/images/photo2.jpg" alt="" />
        </div>
        <div
          class="swiper-slide swiper-slide-active"
          role="group"
          aria-label="3 / 4"
          data-swiper-slide-index="2"
          style="width: 1200px"
        >
          <img src="../Html5&amp;CSS/images/photo3.jpg" alt="" />
        </div>
        <div
          class="swiper-slide swiper-slide-next"
          role="group"
          aria-label="4 / 4"
          data-swiper-slide-index="3"
          style="width: 1200px"
        >
          <img src="../Html5&amp;CSS/images/photo4.jpg" alt="" />
        </div>
      </div>
      <div
        class="swiper-button-next"
        tabindex="0"
        role="button"
        aria-label="Next slide"
        aria-controls="swiper-wrapper-1c52b1972d3c1015b"
      ></div>
      <div
        class="swiper-button-prev"
        tabindex="0"
        role="button"
        aria-label="Previous slide"
        aria-controls="swiper-wrapper-1c52b1972d3c1015b"
      ></div>
      <div
        class="swiper-pagination swiper-pagination-clickable swiper-pagination-bullets swiper-pagination-horizontal"
      >
        <span
          class="swiper-pagination-bullet"
          tabindex="0"
          role="button"
          aria-label="Go to slide 1"
        ></span
        ><span
          class="swiper-pagination-bullet"
          tabindex="0"
          role="button"
          aria-label="Go to slide 2"
        ></span
        ><span
          class="swiper-pagination-bullet swiper-pagination-bullet-active"
          tabindex="0"
          role="button"
          aria-label="Go to slide 3"
          aria-current="true"
        ></span
        ><span
          class="swiper-pagination-bullet"
          tabindex="0"
          role="button"
          aria-label="Go to slide 4"
        ></span>
      </div>
      <span
        class="swiper-notification"
        aria-live="assertive"
        aria-atomic="true"
      ></span>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper(".mySwiper", {
        slidesPerView: 1,
        spaceBetween: 0,
        loop: true,
        autoplay: {
          delay: 1500,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    </script>
  </body>
</html>
