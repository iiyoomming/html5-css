<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: #eee;
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #000;
        margin: 0;
        padding: 0;
      }
      #con {
        position: relative;
      }
      .swiper {
        width: 1200px;
        margin: 0 auto;
        height: 600px;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #ccc;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .swiper {
        margin-left: auto;
        margin-right: auto;
      }
      #con .swiper-pagination-bullet {
        background: #ccc;
        opacity: 0.5;
      }
      #con .swiper-pagination-bullet-active {
        background: #ccc;
        opacity: 1;
      }
      .txt {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        z-index: 10;
      }
      .txt > div {
        font-size: 32px;
        opacity: 0;
        transform: translateY(0);
        transition: 0.8s;
      }
      .txt > div.on {
        opacity: 1;
        transform: translateY(-50px, 50px);
      }
    </style>
  </head>

  <body>
    <!-- Swiper -->
    <div id="con">
      <div
        class="swiper mySwiper swiper-fade swiper-initialized swiper-horizontal swiper-watch-progress swiper-backface-hidden"
      >
        <div
          class="swiper-wrapper"
          id="swiper-wrapper-fe9af410e675a16210"
          aria-live="off"
          style="transition-duration: 0ms; transition-delay: 0ms"
        >
          <div
            class="swiper-slide swiper-slide-next"
            role="group"
            aria-label="3 / 4"
            data-swiper-slide-index="2"
            style="
              width: 1200px;
              opacity: 1;
              transform: translate3d(0px, 0px, 0px);
              transition-duration: 0ms;
            "
          >
            <img src="../images/photo3.jpg" alt="" />
          </div>
          <div
            class="swiper-slide"
            role="group"
            aria-label="4 / 4"
            data-swiper-slide-index="3"
            style="
              width: 1200px;
              opacity: 1;
              transform: translate3d(-1200px, 0px, 0px);
              transition-duration: 0ms;
            "
          >
            <img src="../images/photo4.jpg" alt="" />
          </div>
          <div
            class="swiper-slide swiper-slide-prev"
            role="group"
            aria-label="1 / 4"
            data-swiper-slide-index="0"
            style="
              width: 1200px;
              opacity: 1;
              transform: translate3d(-2400px, 0px, 0px);
              transition-duration: 0ms;
            "
          >
            <img src="../images/photo1.jpg" alt="" />
          </div>
          <div
            class="swiper-slide swiper-slide-visible swiper-slide-fully-visible swiper-slide-active"
            role="group"
            aria-label="2 / 4"
            data-swiper-slide-index="1"
            style="
              width: 1200px;
              opacity: 1;
              transform: translate3d(-3600px, 0px, 0px);
              transition-duration: 0ms;
            "
          >
            <img src="../images/photo2.jpg" alt="" />
          </div>
        </div>
        <div class="txt">
          <div class="">photo1이미지입니다</div>
          <div class="on">photo2이미지입니다</div>
          <div class="">photo3이미지입니다</div>
          <div class="">photo4이미지입니다</div>
        </div>
        <div
          class="swiper-button-next"
          tabindex="0"
          role="button"
          aria-label="Next slide"
          aria-controls="swiper-wrapper-fe9af410e675a16210"
        ></div>
        <div
          class="swiper-button-prev"
          tabindex="0"
          role="button"
          aria-label="Previous slide"
          aria-controls="swiper-wrapper-fe9af410e675a16210"
        ></div>
        <div
          class="swiper-pagination swiper-pagination-clickable swiper-pagination-bullets swiper-pagination-horizontal"
        >
          <span
            class="swiper-pagination-bullet"
            tabindex="0"
            role="button"
            aria-label="Go to slide 1"
          ></span
          ><span
            class="swiper-pagination-bullet swiper-pagination-bullet-active"
            tabindex="0"
            role="button"
            aria-label="Go to slide 2"
            aria-current="true"
          ></span
          ><span
            class="swiper-pagination-bullet"
            tabindex="0"
            role="button"
            aria-label="Go to slide 3"
          ></span
          ><span
            class="swiper-pagination-bullet"
            tabindex="0"
            role="button"
            aria-label="Go to slide 4"
          ></span>
        </div>
        <span
          class="swiper-notification"
          aria-live="assertive"
          aria-atomic="true"
        ></span>
      </div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      let txt = document.querySelectorAll(".txt>div");
      function myfnc() {
        txt.forEach(function (v, k) {
          v.classList.remove("on");
        });
      }
      var swiper = new Swiper(".mySwiper", {
        // direction: "vertical",
        effect: "fade",
        slidesPerView: 1,
        spaceBetween: 0,
        loop: true,
        mousewheel: true,

        autoplay: {
          delay: 1500,
          disableOnInteraction: false,
          pauseOnMouseEnter: true,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        on: {
          slideChange: function () {
            console.log(this.realIndex);
            //console.log(this.activeIndex);
            myfnc();
            txt[this.realIndex].classList.add("on");
          },
        },
      });
    </script>
  </body>
</html>
