<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      .hll {
        width: 100%;
        margin: 0 auto;
        text-align: center;
      }

      .hll .up ul {
        display: flex;
        justify-content: center;
        gap: 15px;
        padding: 100px 0;
      }
      .hll .up ul li {
        border: 1px solid;
        padding: 10px;
      }
      .hll .down {
        position: relative;
      }
      .hll .down div {
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <div class="hll">
      <div class="up">
        <ul>
          <li>ELLE</li>
          <li>COSMOPOLITAN</li>
          <li>Haper's BAZAAR</li>
          <li>ESQUIRE</li>
          <li>STUDIO DOT</li>
          <li>YEET</li>
        </ul>
      </div>

      <div class="down">
        <div class="elle">
          <h1>
            <img
              src=":	https://www.hll.kr/resources/images/main/logo-elle.svg"
              alt=""
            />
          </h1>
          <p>
            <img
              src="	https://www.hll.kr/resources/images/img_visual_elle_pc.png"
              alt=""
            />
          </p>
          <span>
            NO.1<br />
            FASHION & LIFESTYLE<br />
            MEDIA
          </span>
        </div>
        <div class="cosmo">
          <h1>
            <img
              src="https://www.hll.kr/resources/images/main/logo-cosmopolitan.svg"
              alt=""
            />
          </h1>
          <p>
            <img
              src="https://www.hll.kr/resources/images/img_visual_cosmopolitan_pc.png"
              alt=""
            />
          </p>
          <span>Fun, Fearless, Female</span>
        </div>
        <div class="bazaar">
          <h1>
            <img
              src="	https://www.hll.kr/resources/images/main/logo-BAZAAR.svg"
              alt=""
            />
          </h1>
          <p>
            <img
              src="	https://www.hll.kr/resources/images/img_visual_bazaar_pc.png"
              alt=""
            />
          </p>
          <span>Realistic Inspiration from Artistic Creation</span>
        </div>
        <div class="esquire">
          <h1>
            <img
              src="	https://www.hll.kr/resources/images/main/logo-esquire.svg
            "
              alt=""
            />
          </h1>
          <p>
            <img
              src="	https://www.hll.kr/resources/images/img_visual_esquire_pc.png"
              alt=""
            />
          </p>
          <span>MAN AT HIS BEST</span>
        </div>
        <div class="studio">
          <h1>
            <img
              src="https://www.hll.kr/resources/images/main/logo-studio.svg"
              alt=""
            />
          </h1>
          <p>
            <img
              src="	https://www.hll.kr/resources/images/img_visual_STUDIO DOT_pc.png"
              alt=""
            />
          </p>
          <span
            >콘텐츠로 증명하는 '스튜디오닷' 브랜드와 고객의 니즈를 넘나드는 A to
            Z 콘텐츠 솔루션 실행</span
          >
        </div>
        <div class="yeet">
          <h1>
            <img
              src="	https://www.hll.kr/resources/images/main/logo-yeet.png"
              alt=""
            />
          </h1>
          <p>
            <img
              src="		https://www.hll.kr/resources/images/img_visual_yeet_pc.png"
              alt=""
            />
          </p>
          <span>Little Pleasures of Life</span>
        </div>
      </div>
    </div>
  </body>
</html>
