<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      p {
        margin-bottom: 5px;
        position: relative;
        width: 100px;
        height: 100px;
        left: 50px;
        top: 850px;
        border-radius: 50%;
        background: #ccc;
        animation-name: move;
        animation-duration: 1s;
        animation-iteration-count: infinite;
        animation-direction: alternate;
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }
      @keyframes move {
        0% {
          bottom: 100px;
        }
        100% {
          top: 150px;
        }
      }
    </style>
  </head>
  <body>
    <p></p>
  </body>
</html>
