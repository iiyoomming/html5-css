<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transitions</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .txt {
        position: relative;
        font-size: 70px;
        font-weight: bold;
      }
      .black {
        position: absolute;
        display: inline-block;
        left: 0;
        top: 0;
        overflow: hidden;
        white-space: nowrap;
        animation: txt 3s;
      }
      .grey {
        color: #e6e6e6;
      }

      @keyframes txt {
        0% {
          width: 0;
        }
        100% {
          width: 100%;
        }
      }
      h1 {
        font-size: 100px;
        -webkit-text-stroke: 1px red;
        /* text-stroke: 1px red; */
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="txt">
      <p class="black">Hardness Your Data to Hardness Your Data to</p>
      <p class="grey">Hardness Your Data to Hardness Your Data to</p>
    </div>
    <h1>text-stroke 텍스트</h1>
  </body>
</html>
