<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      header .top {
        width: 1190px;
        height: 123px;

        margin: 0 auto;
        display: flex;
        justify-content: space-around;
      }
      header .top li:last-child {
        background: #00a5b1;
        color: #fff;
        padding: 8px 0 9px;
        width: 133px;
        text-align: center;
        left: 50px;
        border-radius: 20px;
        cursor: pointer;
      }
      header .top .logo {
        width: 134px;
        height: 100%;
        display: flex;
        align-items: center;
      }
      header .top .logo a {
        display: block;
        width: 100%;
        height: 64px;
        background: url(http://caffebene.co.kr/images/common/logo.png) no-repeat;
      }
      nav > ul {
        display: flex;
        height: 100%;
        align-items: center;
      }
      nav > ul > li {
        position: relative;
        overflow: hidden;
      }
      nav > ul > li > a {
        color: #444444;
        font-size: 15px;
        padding: 0 29px;
      }

      header:hover nav > ul > li > a {
        color: #333;
      }
      nav > ul > li .sub {
        position: absolute;
        width: 100%;
        height: 180px;
        z-index: 999;
        text-align: center;
        visibility: hidden;
        opacity: 1;
        height: 180px;
      }
      nav > ul:hover > li .sub {
        height: 320px;
        padding: 20px 0;
      }
      .bg {
        position: absolute;
        width: 100%;
        height: 0;
        background: #fff;
        left: 0;
        top: 100px;
        transition: 1s;
      }
      nav > ul:hover ~ .bg {
        height: 360px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="top">
        <div class="logo"><a href="#"></a></div>
        <nav>
          <ul>
            <li>
              <a href="#">MENU</a>
              <ul class="sub">
                <li><a href="#">신메뉴</a></li>
                <li><a href="#">커피</a></li>
                <li><a href="#">음료</a></li>
                <li><a href="#">푸드</a></li>
                <li><a href="#">MD상품</a></li>
              </ul>
            </li>
            <li>
              <a href="#">STORE</a>
              <ul class="sub">
                <li><a href="#">국내</a></li>
                <li><a href="#">해외</a></li>
              </ul>
            </li>
            <li>
              <a href="#">MEMBERSHIP</a>
              <ul class="sub">
                <li><a href="#">등급&혜택</a></li>
                <li><a href="#">가입방법안내</a></li>
                <li><a href="#">서비스 </a></li>
                <li><a href="#">FAQ</a></li>
              </ul>
            </li>
            <li>
              <a href="#">GLOBAL</a>
              <ul class="sub">
                <li><a href="#">해외매장안내</a></li>
                <li><a href="#">해외사업소개</a></li>
                <li><a href="#">해외가맹&유통문의 </a></li>
              </ul>
            </li>
            <li>
              <a href="#">CONTENTS</a>
              <ul class="sub">
                <li><a href="#">커피 </a></li>
                <li><a href="#">우리동네</a></li>
                <li><a href="#">사람들</a></li>
                <li><a href="#">이벤트</a></li>
                <li><a href="#">매장</a></li>
              </ul>
            </li>
            <li>가맹문의</li>
          </ul>
          <div class="bg"></div>
        </nav>
      </div>
    </header>
  </body>
</html>
