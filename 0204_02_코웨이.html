<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      div.title {
        width: 1120px;
        margin: 50px auto;
      }
      ul {
        list-style: none;
      }
      ul.con {
        width: 1120px;
        margin: 50px auto;
        height: 557px;
        display: flex;
      }
      ul.con li {
        width: 373px;
        height: 410px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #fff;
      }
      ul.con li div p {
        word-break: break-all;
      }

      ul.con li div p:last-child {
        display: none;
      }
      ul.con li:hover div p:last-child {
        opacity: 1;
        display: block;
        transition: 0.5s;
      }
      ul.con li:first-child {
        background: url(https://sustainability.coway.co.kr/images/main/policy-img-1.jpg)
          center/cover;
      }
      ul.con li:nth-child(2) {
        background: url(https://sustainability.coway.co.kr/images/main/policy-img-2.jpg)
          center/cover;
      }
      ul.con li:nth-child(3) {
        background: url(https://sustainability.coway.co.kr/images/main/policy-img-3.jpg)
          center/cover;
      }
    </style>
  </head>
  <body>
    <div class="title">
      <h1>ESG Policy & Performance</h1>
      <h4>
        코웨이의 ESG는 환경, 사회, 지배구조에 대한 차별화된 접근 방식을
        반영하며, 이를 통해 장기적인 성과와 지속가능한 가치 창출을 추구합니다.
      </h4>
    </div>
    <ul class="con">
      <li>
        <div>
          <p>Environmental</p>
          <p>
            <img
              src="	https://sustainability.coway.co.kr/images/main/policy-icon-more.png"
              alt="icon"
            />
          </p>
          <p>환경경영 기후변화 대응 친환경 제품 및 자원순환 환경관리</p>
        </div>
      </li>
      <li>
        <div>
          <p>Social</p>
          <p>
            <img
              src="	https://sustainability.coway.co.kr/images/main/policy-icon-more.png"
              alt="icon"
            />
          </p>
          <p>
            임직원 인권경영 공급망 고객 중심 경영 지역사회 안전보건 제품 품질 및
            안전 정보보안 및 개인정보보호
          </p>
        </div>
      </li>
      <li>
        <div>
          <p>Governance</p>
          <p>
            <img
              src="	https://sustainability.coway.co.kr/images/main/policy-icon-more.png"
              alt="icon"
            />
          </p>
          <p>지배구조 정도경영 대응 리스크 관리</p>
        </div>
      </li>
    </ul>
  </body>
</html>
