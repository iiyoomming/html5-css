<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      div {
        width: 640px;
        height: 200px;
        margin: 20px 0 0 50px;
        padding: 20px;
        background: #666;
      }
      a {
        text-decoration: none;
        position: relative;
      }
      div a:hover p:nth-child(1) {
        opacity: 1;
      }
      div a p:nth-child(1) {
        opacity: 0;
        color: #fff;
        white-space: nowrap;
        transition: 0.8s;
      }
      div a p:nth-child(2) {
        position: absolute;
        color: #666;
        font-size: 30px;
        position: absolute;
        background: #fff;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        top: -10px;
        font-weight: bold;
        text-align: center;
      }
      div a:hover p:nth-child(2) {
        animation-name: ani;
        animation-duration: 1s;
        animation-timing-function: ease-in-out;
      }
      @keyframes ani {
        0% {
          left: 0;
        }
        100% {
          left: 90px;
        }
      }
    </style>
  </head>
  <body>
    <div>
      <a href="#">
        <p>View more</p>
        <p>+</p>
      </a>
    </div>
  </body>
</html>
