<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .grid {
        width: 1680px;
        margin: 20px auto;
        height: 780px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 24px;
        grid-template-areas: "one two three three" "one four five six";
      }
      .one,
      .two,
      .three,
      .four,
      .five,
      .six {
        border-radius: 20px;
      }
      .one {
        grid-area: one;
        background: #aaa;
        background-image: url(https://www.doosanrobotics.com/images/services/robot-training-img01.png);
      }
      .two {
        grid-area: two;
        background: #bbb;
        padding: 48px 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .two h4 {
        font-size: 32px;
        font-weight: 600;
        text-wrap: nowrap;
      }
      .two h4 strong {
        font-weight: 600;
        color: #005eb8;
      }
      .two p {
        font-size: 18px;
        letter-spacing: -0.035em;
        word-break: keep-all;
        overflow-wrap: break-word;
        color: #444;
      }
      .three {
        grid-area: three;
        background: #ccc;
        background-image: url(https://www.doosanrobotics.com/images/services/robot-training-img02.png);
      }
      .four {
        grid-area: four;
        background: #ddd;
        background-image: url(https://www.doosanrobotics.com/images/services/robot-training-img03.png);
      }
      .five {
        grid-area: five;
        background: #eee;
        background-image: url(https://www.doosanrobotics.com/images/services/robot-training-img04.png);
      }
      .six {
        grid-area: six;
        background: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="one"></div>
      <div class="two">
        <h4>
          현장에서 바로 적용 가능한 <br /><strong>최고의 실습 교육</strong>
        </h4>
        <p>
          두산로보틱스에서 개발한 검증된 실무형 교육 커리큘럼으로, 실제 현장에서
          바로 적용하며 시시각각 발생하는 다양한 문제를 해결할 수 있도록
          설계되었습니다.
        </p>
      </div>
      <div class="three"></div>
      <div class="four"></div>
      <div class="five"></div>
      <div class="six"></div>
    </div>
  </body>
</html>
