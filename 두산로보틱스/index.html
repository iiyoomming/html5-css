<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #ccc;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
      }
      .edu {
        width: 1680px;
        height: 780px;
        display: flex;
        gap: 24px;
        margin: 0 auto;
      }
      .edu > div.left {
        flex: 1;
        border-radius: 20px;
        overflow: hidden;
      }
      .edu > div.right {
        flex: 3;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .edu > div.right img {
        width: 100%;
        height: 100%;
      }
      .edu > div.right > div.inner {
        width: 100%;
        flex: 1;
        display: flex;
        gap: 24px;
      }
      .edu > div.right > div.inner .txt {
        padding: 48px 40px;
        flex-direction: column;
        display: flex;
        justify-content: space-between;
        height: 100%;
        box-sizing: border-box;
        align-items: center;
      }
      .edu > div.right > div.inner .txt h2 {
        font-size: 32px;
        word-break: keep-all;
        letter-spacing: -4px;
        font-weight: normal;
      }
      .edu > div.right > div.inner:first-child > div:first-child {
        width: 398px;
        background: #fff;
        border-radius: 20px;
      }
      .edu > div.right > div.inner:first-child > div:last-child {
        flex: 2;
      }
      .edu > div.right > div.inner:last-child > div {
        flex: 1;
        background: #fff;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="edu">
      <div class="left">
        <img src="./images/robot-training-img01.png" alt="" />
      </div>
      <div class="right">
        <div class="inner">
          <div>
            <div class="txt">
              <h2>현장에서 바로 적용 가능한 <span>최고의 실습 교육</span></h2>
              <p>
                두산로보틱스에서 개발한 검증된 실무형 교육 커리큘럼으로, 실제
                현장에서 바로 적용하며 시시각각 발생하는 다양한 문제를 해결할 수
                있도록 설계되었습니다.
              </p>
            </div>
          </div>
          <div>
            <img src="./images/robot-training-img02.png" alt="" />
          </div>
        </div>
        <div class="inner">
          <div>
            <img src="./images/robot-training-img03.png" alt="" />
          </div>
          <div>
            <img src="./images/robot-training-img04.png" alt="" />
          </div>
          <div>
            <div class="txt">
              <h2>초보자부터 전문가까지 <span>수준별 교육 제공</span></h2>
              <p>
                초보자부터 현업 엔지니어 및 교수까지 수준별로 들을 수 있는
                맞춤형 교육이 마련돼 있습니다.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
