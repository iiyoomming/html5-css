<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
      }
      .bg {
        width: 1920px;
        height: 100vh;
        position: absolute;
        left: 0;
        top: 0;
        z-index: -1;
      }
      .bg video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .con {
        display: flex;
        text-align: center;
        justify-content: center;
        margin-top: 300px;
      }
      .con p {
        color: #fff;
        font-size: 68px;
      }
      .box {
        text-align: center;
        justify-content: center;
        margin-top: 50px;
      }
      .box a {
        text-decoration: none;

        background-color: #f0f0f0;
        opacity: 0.5;
        padding: 20px;
        border-radius: 30px;
      }
      .box a span {
        color: #fff;
      }
    </style>
  </head>

  <body>
    <div class="bg">
      <video autoplay muted loop>
        <source
          src="https://www.doosanrobotics.com/media/visual-1.mp4"
          type="video/mp4"
        />
      </video>
    </div>
    <div class="con">
      <p>
        Innovation In Every Motion, <br />
        Revolutionizing the Way You Work
      </p>
    </div>
    <div class="box">
      <a href="#"><span>두산 로봇과 함께 상상을 실현해 보세요</span></a>
    </div>
  </body>
</html>
