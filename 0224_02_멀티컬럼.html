<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transitions</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      ul li {
        padding: 0 20px;
        line-height: 80px;
      }
      ul li .ico {
        width: 72px;
        height: 72px;
        background: #000;
      }
      ul li:nth-child(1) .ico {
        mask-image: url(./images/ico_business_item01.svg);
      }
      ul li:nth-child(1):hover .ico {
        background: #be8556;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <p class="ico"></p>
        <p>
          건축 <span>건축</span
          ><span
            ><img src="./images/ico_circle_arrow.png" alt="ico_circle_arrow"
          /></span>
        </p>
      </li>
    </ul>
  </body>
</html>
