<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .scroll {
        width: 160px;
        height: 160px;
        background: linear-gradient(rgb(62, 104, 255), rgb(110, 124, 255));
        border-radius: 50%;
        position: relative;
      }
      .scroll p {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      .scroll p:first-child {
        width: 90%;
        height: 90%;
      }
      .scroll p:first-child img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        animation: rotate_image 7s linear infinite;
        transform-origin: 50% 50%;
      }

      @keyframes rotate_image {
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="scroll">
      <p><img src="./images/scroll_down.png" alt="scroll" /></p>
      <p><img src="./images/down.png" alt="down" /></p>
    </div>
    <p class="arc"><img src="./images/Group 1.png" alt="" /></p>
    <p class="arc"><img src="./images/Group 1.svg" alt="" /></p>
  </body>
</html>
