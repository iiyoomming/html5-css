<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
      }
      section {
        position: relative;
        height: 100vh;
      }
      section .bg {
        width: 100%;
        height: 100%;
      }

      section .bg video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      section .con {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        margin-left: 100px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        color: #fff;
      }
      section .con h1 {
        font-size: 47px;
      }
      section .con p {
        margin-top: 30px;
        font-size: 18px;
      }
      .modal {
        position: fixed;
        right: 0;
        bottom: 0;
        margin: 0 20px 20px 0;
      }
      .modal img {
        width: 400px;
        height: 400px;
        object-fit: cover;
      }
    </style>
  </head>
  <body onload="popup()">
    <section>
      <div class="bg">
        <video autoplay muted loop>
          <source
            src="https://www.jakomosofa.com/_File/popBanner//file_1736235204_0.mp4"
            type="video/mp4"
          />
        </video>
      </div>
      <div class="con">
        <h1>
          1등 소파만의 압도적 기준 <br />
          소파는 결국, 자코모
        </h1>
        <p>We Make Quality JAKOMO</p>
      </div>
    </section>

      <p>
        <img
          src="	https://www.jakomosofa.com/_File/popBanner//file_1737333806_0.jpg"

  </body>
</html>
