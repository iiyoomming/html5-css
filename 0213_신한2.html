<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      ul.data {
        width: 1200px;
        margin: 50px auto;
        display: flex;
        flex-wrap: wrap;
      }
      ul.data li {
        width: 1200/3;
        height: 257px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 20px;
        /* padding: 12px; */
        margin: 12px;
        flex: 1 auto;
      }
      ul.data li div.txt {
        margin-top: 30px;
        word-break: keep-all;
      }
      ul.data li div.txt h2 {
        margin-bottom: 20px;
        font-size: 22px;
        color: #011b6a;
      }
      ul.data li div.txt:nth-child(2) {
        color: #111518;
        font-size: 15px;
      }
      ul.data li p img {
        width: 59px;
        margin-top: 30px;
      }
      ul.data li:nth-child(4) {
        flex: 2 auto;
        padding: 0;
      }
      ul.data li:nth-child(5) {
        padding: 0;
      }
    </style>
  </head>
  <body>
    <ul class="data">
      <li>
        <p>
          <img
            src="https://databada.shinhancard.com/assets/icon_custom_01-D_uGWqzi.png"
            alt="icon_custom_01-D_uGWqzi"
          />
        </p>
        <div class="txt">
          <h2>Macro Data</h2>
          <p>지역경제, 민간소비, 경제효과, 관광/상권 Data 등</p>
        </div>
      </li>
      <li>
        <p>
          <img
            src="https://databada.shinhancard.com/assets/icon_custom_02-C3Fg9Baz.png"
            alt="icon_custom_02-C3Fg9Baz"
          />
        </p>
        <div class="txt">
          <h2>Consumer Data</h2>
          <p>Profile Data, Micro Segments, 고객유입/이탈 등</p>
        </div>
      </li>
      <li>
        <p>
          <img
            src="https://databada.shinhancard.com/assets/icon_custom_03-CBdTtg5L.png"
            alt="icon_custom_03-CBdTtg5L"
          />
        </p>
        <div class="txt">
          <h2>Macro Data</h2>
          <p>지역경제, 민간소비, 경제효과, 관광/상권 Data 등</p>
        </div>
      </li>
      <li>
        <p>
          <img
            src="https://databada.shinhancard.com/assets/icon_custom_04-DYHLchGC.png"
            alt="icon_custom_04-DYHLchGC"
          />
        </p>
        <div class="txt">
          <h2>E-Commerce Data</h2>
          <p>e커머스 카테고리/브랜드/상품 Data</p>

      <li>
        <p>
          <img
            src="https://databada.shinhancard.com/assets/icon_custom_05-DIu7oY9U.png"
            alt="icon_custom_05-DIu7oY9U"
          />

        <div class="txt">
          <h2>Market Data</h2>
