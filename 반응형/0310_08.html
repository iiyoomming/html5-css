<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      .con {
        width: 98%;
        max-width: 1720px;
        margin: 20px auto;
        display: flex;
      }
      .con li {
        display: flex;
        width: calc((100% - 2px) / 3);
        padding: 0 30px;
      }
      .con li .txt {
        width: 100%;
      }
      .con li .txt h4 {
        font-size: 30px;
        margin-bottom: 20px;
      }
      .con li .txt p {
        font-size: 20px;
        margin-bottom: 10px;
        word-break: keep-all;
        word-wrap: break-word;
      }

      .con li img {
        width: 93px;
        height: 100px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <ul class="con">
      <li>
        <div class="txt">
          <h4>오픈소싱</h4>
          <p>
            내부 심의를 통해 선정된 업체는 당사의 아웃소싱 데이터베이스로
            관리합니다.
          </p>
          <a href="#">더보기</a>
        </div>
        <img
          src="	https://www.samsungshi.com/images/main/icon_source.png"
          alt=""
        />
      </li>
      <li>
        <div class="txt">
          <h4>방문신청</h4>
          <p>
            협력업체 지원신청, 출입 예약 시스템으로 편리한 방문신청이
            가능합니다.
          </p>
          <a href="#">더보기</a>
        </div>
        <img
          src="	https://www.samsungshi.com/images/main/icon_visit.png"
          alt=""
        />
      </li>
      <li>
        <div class="txt">
          <h4>윤리경영/제보</h4>
          <p>
            임직원의 불공정한 업무처리 및 비리에 대한 제보를 받으며, 비공개
            방식으로 처리됩니다.
          </p>
          <a href="#">더보기</a>
        </div>
        <img
          src="	https://www.samsungshi.com/images/main/icon_suggest.png"
          alt=""
        />
      </li>
    </ul>
  </body>
</html>
