<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      section {
        width: 100%;
        max-width: 1280px;
        margin: 100px auto;
      }
      section ul {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
      }
      section ul li {
        margin-top: 20px;
        flex: 1 1 40%;
        background: #ccc;
        padding-top: 50%;
        border-top-left-radius: 40px;
        border-bottom-right-radius: 40px;
        position: relative;
      }
      section ul li:first-child {
        background: url(https://www.shinsegaefood.com/images/background/bg_vs_value_1.jpg)
          center/cover;
        margin-left: 20px;
      }
      section ul li:nth-child(2) {
        background: url(https://www.shinsegaefood.com/images/background/bg_vs_value_2.jpg)
          center/cover;
        margin-right: 20px;
      }
      section ul li:nth-child(3) {
        background: url(https://www.shinsegaefood.com/images/background/bg_vs_value_3.jpg)
          center/cover;
        margin-left: 20px;
      }
      section ul li:nth-child(4) {
        background: url(https://www.shinsegaefood.com/images/background/bg_vs_value_4.jpg)
          center/cover;
        margin-right: 20px;
      }

      section ul li .txt {
        color: #fff;
        width: 100%;
        text-align: center;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.3);
      }
      section ul li:nth-child(odd) {
        margin-top: -55px;
      }
      section ul li .txt p {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <section>
      <ul>
        <li>
          <div class="txt">
            <h4>Taste & Quality</h4>
            <p>최선의 '품질'을 통해 <br />최상의 '맛'을 구현합니다</p>
          </div>
        </li>
        <li>
          <div class="txt">
            <h4>Convenience</h4>
            <p>
              보관/조리/폐기 전반에 걸친 고객 중심 마인드로 <br />최적화된
              편의를 제공합니다.
            </p>
          </div>
        </li>
        <li>
          <div class="txt">
            <h4>Health & Wellness</h4>
            <p>
              고객의 건강과 라이프스타일을 지원하는 <br />맞춤형 푸드 옵션을
              제공합니다.
            </p>
          </div>
        </li>
        <li>
          <div class="txt">
            <h4>Value</h4>
            <p>
              지구와 사회에 긍정적인 영향을 주는 <br />지속 가능하고 책임감 있는
              사업을 이어갑니다.
            </p>
          </div>
        </li>
      </ul>
    </section>
  </body>
</html>
