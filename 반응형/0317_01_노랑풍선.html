<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      ul {
        list-style: none;
        margin: 0 auto;
        width: 100%;
        max-width: 1480px;
        display: flex;
        flex-wrap: wrap;
        padding: 0 20px;
        box-sizing: border-box;
      }
      li {
        width: 100%;
        height: 100%;
        display: flex;
        gap: 85px;
        align-items: center;
        text-align: center;
      }
      ul li:nth-child(2n) {
        flex-direction: row-reverse;
      }
      ul li:nth-child(2n) .txt {
        text-align: right;
      }
      ul li p {
        width: 720px;
        height: 440px;
        border-radius: 10px;
        overflow: hidden;
        flex-shrink: 1;
      }
      ul li p img {
        width: 100%;
        height: 100%;

        object-fit: cover;
      }
      .txt {
        width: 440px;
        height: 440px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        word-break: keep-all;
        flex-shrink: 0;
      }
      .txt h4 {
        font-size: 24px;
        color: #bbb;
        margin-bottom: 0;
        font-weight: normal;
      }
      .txt h2 {
        font-size: 44px;
        margin: 0;
        font-weight: normal;
      }
      .txt h1 {
        font-size: 44px;
        margin: 0;
        color: #ffc72c;
      }
      @media screen and (max-width: 1024px) {
        .txt {
          flex-shrink: 1;
          align-items: flex-start;
        }
        .txt h4 {
          font-size: 16px;
        }
        .txt h2,
        .txt h1 {
          font-size: 22px;
        }
        ul li p {
          height: auto;
        }
      }
      @media screen and (max-width: 750px) {
        ul li {
          width: 100%;
          height: 100%;
          display: flex;
          flex-wrap: wrap;
          gap: 0;
        }
        ul li p {
          margin: 0;
        }
        ul li p img {
          border-radius: 10px;
        }
        ul li .txt {
          width: 265px;
          height: auto;

          text-align: left;
        }
        .txt h4 {
          margin: 0;
        }
        ul li:nth-child(2n) {
          flex-direction: row;
        }
        ul li:nth-child(2n) .txt {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <p>
          <img
            src="	https://company.ybtour.co.kr/images/bg/bg_story_1.jpg"
            alt=""
          />
        </p>
        <div class="txt">
          <h4>여행의 새로운 가치를 알립니다</h4>
          <h2>가치를 전달하는 여행</h2>
          <h1>Value-Creating</h1>
        </div>
      </li>
      <li>
        <p>
          <img
            src="	https://company.ybtour.co.kr/images/bg/bg_story_2.jpg"
            alt=""
          />
        </p>
        <div class="txt">
          <h4>고객의, 고객에 의한, 고객을 위한</h4>
          <h2>신뢰를 받는 여행</h2>
          <h1>Trustworthy</h1>
        </div>
      </li>
      <li>
        <p>
          <img
            src="	https://company.ybtour.co.kr/images/bg/bg_story_3.jpg"
            alt=""
          />
        </p>
        <div class="txt">
          <h4>일상의 가장 반짝이는 순간을 만듭니다</h4>
          <h2>즐거움을 선사하는 여행</h2>
          <h1>Joyful</h1>
        </div>
      </li>
      <li>
        <p>
          <img
            src="	https://company.ybtour.co.kr/images/bg/bg_story_4.jpg"
            alt=""
          />
        </p>
        <div class="txt">
          <h4>다양한 여행상품으로 여행 문화를 선도합니다</h4>
          <h2>혁신적인 여행</h2>
          <h1>Innovative</h1>
        </div>
      </li>
    </ul>
  </body>
</html>
