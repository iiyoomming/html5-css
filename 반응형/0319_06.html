    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      .han {
        padding: 0 80px;
        box-sizing: border-box;
      }
      .han ul {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .han ul li {
        width: calc((100% - 20px) / 3);
        border: 1px solid #e5e5e5;
        border-radius: 10px;
        padding: 25px 22px;
        box-sizing: border-box;
      }
      .han ul li p {
        position: relative;
      }
      .han ul li p::after {
        content: "";
        width: 26px;
        height: 26px;
        position: absolute;
        right: 0;
        top: 20px;
        border: 1px solid #e5e5e5;
        border-radius: 50%;
      }
      .han ul li:hover p::after {
        background: #f37321;
      }
      .han ul li img {
        width: 100%;
      }
      @media screen and (max-width: 768px) {
        .han ul li {
          width: calc((100% - 20px) / 2);
        }
      }
      @media screen and (max-width: 670px) {
        .han ul li {
          width: 100%;
        }
      }
    </style>
  </head>
