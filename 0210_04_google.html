<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      div.top {
        width: 1912px;
        height: 60px;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      div.top ul {
        width: 100%;
        list-style: none;
        display: flex;
      }
      div.top ul li {
        padding-left: 20px;
      }
      div.top ul.left {
        width: 100%;
        height: 100%;
      }
      div.top ul li a {
        text-decoration: none;
        color: #000;
      }
      div.top ul.right {
        width: 100%;
        height: 100%;
      }
      div.top ul li p.app img {
        width: 24px;
        opacity: 0.5;
      }
      div.top ul.right li:nth-child(4) {
        background: #0b57d0;
        color: #fff;
        width: 85px;
        height: 40px;
        left: 0;
        top: 0;
        border-radius: 40px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <ul class="left">
        <li><a href="">Google 정보</a></li>
        <li><a href="">스토어</a></li>
      </ul>
      <ul class="right">
        <li><a href="">Gmail</a></li>
        <li><a href="">이미지</a></li>
        <li>
          <p class="app"><img src="./images/app.svg" alt="app" /></p>
        </li>
        <li>로그인</li>
      </ul>
    </div>
  </body>
</html>
