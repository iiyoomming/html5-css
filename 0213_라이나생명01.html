<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        text-decoration: none;
        color: #333;
      }
      ul.cyber {
        width: 1140px;
        margin: 50px auto;
        display: flex;
        justify-content: space-between;
      }
      ul.cyber li {
        width: 160px;
        height: 168px;
        flex: 1;
        text-align: center;
      }

      ul.cyber li p img {
        width: 60px;
        border-radius: 14px;
        background: #f4f4fc;
        border: 1px solid #f4f4fc;
        padding: 17px;
        transition: 0.5s;
      }
      ul.cyber li:hover p img {
        background: transparent;
        border: 1px solid #1237c9;
      }
      ul.cyber li p:nth-child(2) {
        color: #333;
        font-weight: 700;
        margin-top: 18px;
        word-break: keep-all;
        width: 50%;
        margin: 0 auto;
      }
      ul.cyber li:hover p:nth-child(2) {
        color: #1237c9;
        font-weight: 900;
      }
      ul.cyber li:nth-child(4):hover p:first-child,
      ul.cyber li:nth-child(6):hover p:first-child {
        background: transparent;
      }
      ul.cyber li:nth-child(4):hover p:first-child img {
        content: url(https://www.lina.co.kr/_nuxt/img/icon_cyber_home4_h.5cb36ad44edf9bb68e2e8b95c9329d2f.png);
      }
      ul.cyber li:nth-child(6):hover p:first-child img {
        content: url(https://www.lina.co.kr/_nuxt/img/icon_cyber_home6_h.e4e1b9aa17c953a0bd42256b3b8c2580.png);
      }
    </style>
