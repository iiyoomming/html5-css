<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .logo {
        position: relative;
      }
      .one {
        position: absolute;
        width: 500px;
        height: 500px;
        background: url(https://hg.mirae-n.com/front/images/main_new/logo01.svg)
          no-repeat;
      }
      .two {
        position: absolute;
        width: 500px;
        height: 500px;
        left: 100px;
        top: 0;
        background: url(https://hg.mirae-n.com/front/images/main_new/logo02.svg)
          no-repeat;
        mix-blend-mode: multiply;
      }
      .three {
        position: absolute;
        width: 500px;
        height: 500px;
        left: 200px;
        background: url(https://hg.mirae-n.com/front/images/main_new/logo03.svg)
          no-repeat;
        mix-blend-mode: multiply;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <p class="one"></p>
      <p class="two"></p>
      <p class="three"></p>
    </div>
  </body>
</html>
